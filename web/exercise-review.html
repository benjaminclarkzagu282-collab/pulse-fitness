<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PULSE · 全动作肌群示意</title>
  <script type="module" src="assets/packages/model_viewer_plus/assets/model-viewer.min.js"></script>
  <script src="assets/assets/muscles/controller.js"></script>
  <script src="review/model-download.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#101511;--panel:#19201a;--line:#303c31;--muted:#a5b0a3;--lime:#d0f879}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f0f3eb;font:15px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1260px;margin:auto;padding:28px 30px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:800;letter-spacing:3px;color:var(--lime);white-space:nowrap}.badge{font-size:12px;color:var(--muted)}h1{font-size:30px;line-height:1.3;margin:22px 0 6px}.intro{color:var(--muted);font-size:13px;margin:0 0 18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.selector{display:flex;gap:8px;align-items:center}.selector label{font-size:12px;color:var(--muted)}button,select{font:inherit;color:inherit;border:1px solid #46513f;border-radius:10px;background:#252f24;padding:9px 13px;cursor:pointer}button:hover,button:focus-visible,select:focus-visible{border-color:var(--lime)}button:disabled,select:disabled,input:disabled{opacity:.45;cursor:wait}.primary{background:var(--lime);border-color:var(--lime);color:#15200d;font-weight:700;min-width:82px}.mode{display:flex;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}.mode button{border:0;background:transparent;font-size:13px;padding:6px 10px}.mode button[aria-pressed=true]{background:var(--lime);color:#15200d;font-weight:700}.legend{font-size:12px;color:var(--muted);margin-left:auto}.views{display:grid;grid-template-columns:1fr 1fr;gap:14px}.view{position:relative;background:radial-gradient(ellipse at 50% 70%,#303a2e,var(--panel) 70%);border:1px solid var(--line);border-radius:18px;overflow:hidden}.view-title{position:absolute;top:14px;left:16px;z-index:1;pointer-events:none}.view-title b{font-size:15px}.view-title small{display:block;color:var(--muted);font-size:11px}.switch-view{position:absolute;right:14px;top:14px;z-index:2;font-size:12px;padding:5px 9px}model-viewer{display:block;width:100%;height:410px;--poster-color:transparent}.status{padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:14px 0}.status[hidden]{display:none}.regions{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.regions[hidden]{display:none}.regions button{font-size:12px;border-radius:22px;padding:7px 12px}.regions button[aria-pressed=true]{border-color:#ffa65d;background:#352b21}.regions button[data-role=stabilizer][aria-pressed=true]{border-color:#56d9b0;background:#193c31}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#ff9c50}.dot.teal{background:#56d9b0}.guidance{padding:12px 16px;border-left:3px solid #ffa65d;background:#1d251c;border-radius:0 12px 12px 0}.guidance b{font-size:15px}.guidance p{font-size:13px;color:#c3cdbb;margin:3px 0 0}.guidance small{font-size:12px;color:var(--muted);display:block;margin-top:4px}.controls{margin-top:14px;padding:18px 22px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row label{color:var(--muted);font-size:13px}.time{margin-left:auto;color:var(--lime);font-variant-numeric:tabular-nums}input[type=range]{width:100%;height:20px;accent-color:var(--lime);margin:18px 0 10px}.frames button{font-size:12px;padding:7px 11px}.frames span{font-size:11px;color:var(--muted)}.marks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.marks button{flex:1;font-size:12px;white-space:nowrap;padding:7px}.notes{color:var(--muted);font-size:12px;line-height:1.9;margin-top:20px}.notes a,footer a{color:#d3e5b1;text-underline-offset:4px}footer{border-top:1px solid var(--line);margin-top:20px;padding-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
    @media(max-width:640px){main{padding:18px 14px}.brand{font-size:11px;letter-spacing:2px}.badge{font-size:10px}h1{font-size:25px;margin-top:18px}.selector{width:100%}.selector select{flex:1;font-size:14px}.toolbar{gap:8px}.legend{margin-left:0;width:100%;font-size:11px}.views{gap:9px}.view{border-radius:14px}.view-title{left:10px;top:11px}.view-title small{display:none}.switch-view{top:40px;right:8px;font-size:11px;padding:4px 7px}model-viewer{height:290px}.floor .views{grid-template-columns:1fr}.floor model-viewer{height:215px}.floor .switch-view{top:12px}.controls{padding:14px}.marks button{flex-basis:40%}.time{font-size:12px}.guidance{padding:10px 12px}.regions button{padding:6px 9px}.intro{line-height:1.6}}
  </style>
</head>
<body><main>
  <header><span class="brand">PULSE / MOTION</span><span class="badge" id="catalog-count">肌群动态示意</span></header>
  <h1 id="title">看见每个动作中的肌群参与。</h1>
  <p class="intro">同一人物，同步多视角。可拖动旋转，暂停查看参与区域。</p>
  <div class="toolbar"><div class="selector"><label for="exercise">查看动作</label><select id="exercise" disabled></select></div><div class="mode"><button data-mode="on" aria-pressed="true" disabled>肌群示意</button><button data-mode="off" aria-pressed="false" disabled>正常人物</button></div><button id="play" class="primary" disabled>播放预览</button><span class="legend"><span class="dot"></span>主参与区域　<span class="dot teal"></span>稳定区域</span></div>
  <div class="status" id="status" role="status">正在载入动作库…</div>
  <section class="views" aria-label="同步动作预览"><div class="view"><div class="view-title"><b id="view-label">正面</b><small>查看两侧动作与肌群位置</small></div><button class="switch-view" id="back" disabled>看背面</button><div id="front-slot"></div></div><div class="view"><div class="view-title"><b>侧面</b><small>查看姿态、幅度与支撑</small></div><div id="side-slot"></div></div></section>
  <section class="regions" id="regions" aria-label="选择肌群"></section>
  <div class="guidance"><b id="phase">准备</b><p id="explanation">动作载入后可选择肌群。</p><small id="detail">颜色表示参与角色，明暗只提示动作阶段；不是实测受力。</small></div>
  <section class="controls" aria-label="动作播放控制"><div class="row"><button id="reset" disabled>回到起始</button><label>速度 <select id="speed" disabled><option value=".25">0.25×</option><option value=".5" selected>0.5×</option><option value="1">1×</option></select></label><span class="time" id="time">0.00 / 6.00 秒</span></div><input id="seek" type="range" aria-label="动作进度（秒）" min="0" max="6" step=".01" value="0" disabled><div class="row frames"><button id="previous" disabled>← 上一帧</button><button id="next" disabled>下一帧 →</button><span>每步 1/30 秒</span></div><div class="marks" id="marks"></div></section>
  <div class="notes"><p id="scope">覆盖部分相关肌群，展示表面位置。动作属于参考制作的示意，尚未经教练复核。</p><p id="references"></p></div>
  <footer><span>可暂停 · 可慢放 · 普通人物对比</span><a href="/">返回健身 App</a><a href="squat-review.html">查看原深蹲样板</a></footer>
</main>
<script>
  const $=id=>document.getElementById(id);
  let catalog,exerciseId='squat',viewers=[],controllers=[],time=0,playing=false,ready=false,last=null,loadVersion=0,loadAbort;
  let muscles=true,selected='all',back=false;
  const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function current(){return catalog.exercises[exerciseId];}
  function camera(index){
    const framing=current().camera;
    const aspect=viewers[index].clientWidth/viewers[index].clientHeight;
    const perspective=2*Math.tan(Math.PI/12);
    const distance=Math.max(framing.minDistance,Math.max(framing.motionWidth*1.16/(perspective*Math.max(aspect,.1)),(framing.motionHeight||0)*1.16/perspective)+(framing.depthMargin||0)+.3);
    return `${index===1?90:back?180:0}deg 90deg ${distance}m`;
  }
  function cameraUpdate(){viewers.forEach((v,i)=>{if(v.clientWidth)v.cameraOrbit=camera(i);});}
  const resize=new ResizeObserver(()=>cameraUpdate());
  function paintGuidance(){
    const data=current();
    const phase=data.phases.find(p=>time>=p.start&&time<p.end)||data.phases.at(-1);
    const region=data.regions.find(r=>r.id===selected);
    $('phase').textContent=phase.label+(muscles?' · '+(region?.name||'肌群参与'):'');
    $('explanation').textContent=phase.text;
    $('detail').textContent=muscles&&region?region.description:'颜色表示参与角色，明暗只提示动作阶段；不是实测受力。';
  }
  function show(){
    viewers.forEach(v=>v.currentTime=time);
    $('seek').value=String(time);$('time').textContent=`${time.toFixed(2)} / 6.00 秒`;
    $('play').textContent=playing?'暂停预览':'播放预览';
    if(catalog)paintGuidance();
  }
  function jump(value){time=Math.max(0,Math.min(6,value));playing=false;last=null;show();}
  function setBack(value){back=value;$('view-label').textContent=back?'背面':'正面';$('back').textContent=back?'看正面':'看背面';viewers[0]?.setAttribute('alt',`${current().name}${back?'背面':'正面'}三维预览`);cameraUpdate();}
  function syncRegion(refocus=false){
    controllers.forEach((c,i)=>c.update({muscles,selectedRegion:selected,...(refocus?{orbit:camera(i)}:{})}));
    $('regions').hidden=!muscles;
    document.querySelectorAll('[data-region]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.region===selected)));
    document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.mode==='on')===muscles)));
    paintGuidance();
  }
  function button(text,action){const b=document.createElement('button');b.textContent=text;b.addEventListener('click',action);return b;}
  function renderControls(){
    const data=current();$('title').textContent=data.name+' · 肌群参与';
    $('regions').replaceChildren();
    for(const region of [{id:'all',name:'全部区域'},...data.regions]){
      const b=button(region.name,()=>{selected=region.id;if(region.id!=='all')setBack(region.view==='back');syncRegion(true);});
      b.dataset.region=region.id;b.dataset.role=region.role||'';b.setAttribute('aria-pressed',String(region.id==='all'));
      if(region.role){const dot=document.createElement('span');dot.className='dot'+(region.role==='stabilizer'?' teal':'');b.prepend(dot);}
      $('regions').append(b);
    }
    $('marks').replaceChildren();
    data.phases.forEach((phase,i)=>$('marks').append(button(`${i+1}. ${phase.label}`,()=>jump((phase.start+phase.end)/2))));
    $('references').replaceChildren(document.createTextNode('动作参考：'));
    data.referenceUrls.forEach((url,i)=>{const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent=`参考 ${i+1}`;$('references').append(a,document.createTextNode('　'));});
    $('scope').textContent='覆盖部分相关肌群，展示表面位置。动作属于参考制作的示意，尚未经教练复核。'+(data.demoNote||'');
  }
  let modelLocation;
  async function loadExercise(id){
    const version=++loadVersion;loadAbort?.abort();loadAbort=new AbortController();const signal=loadAbort.signal;
    controllers.forEach(c=>c.dispose());controllers=[];resize.disconnect();ready=false;playing=false;time=0;selected='all';back=false;last=null;exerciseId=id;
    document.body.classList.toggle('floor',current().camera.floor);
    $('status').hidden=false;$('status').textContent='正在载入'+current().name+'…';
    renderControls();document.querySelectorAll('button,select,input').forEach(e=>e.disabled=true);$('exercise').disabled=false;
    modelLocation?.release(); modelLocation=null;
    let source;
    try {
      source=await PulseModelDelivery.resolve(id,{signal,progress:(n,total)=>{if(version===loadVersion)$('status').textContent=`正在下载 ${Math.round(n/total*100)}%`;}});
      if(version!==loadVersion){source.release();return;}
      modelLocation=source;
    } catch(error) {if(version===loadVersion&&error.name!=='AbortError')$('status').textContent=error.message;return;}
    const loading=[];
    viewers=['front','side'].map((view,index)=>{
      const v=document.createElement('model-viewer');
      v.setAttribute('camera-controls','');v.setAttribute('disable-pan','');v.setAttribute('touch-action','pan-y');
      for(const [name,value] of Object.entries({'alt':`${current().name}${index?'侧面':'正面'}三维预览`,'animation-name':'Exercise','camera-target':current().cameraTarget,'min-camera-orbit':'auto 15deg 1.5m','max-camera-orbit':'auto 95deg 20m','field-of-view':'30deg','exposure':'1','shadow-intensity':'1','shadow-softness':'.75','interaction-prompt':'none','loading':'eager'}))v.setAttribute(name,value);
      loading.push(new Promise((resolve,reject)=>{
        const timeout=setTimeout(()=>reject(new Error('人物载入超时，请重新选择动作。')),30000);
        const finish=fn=>()=>{clearTimeout(timeout);fn();};
        v.addEventListener('load',finish(resolve),{once:true,signal});
        v.addEventListener('error',finish(()=>reject(new Error('人物暂时无法载入，请重新选择动作。'))),{once:true,signal});
        signal.addEventListener('abort',finish(()=>reject(new DOMException('Cancelled','AbortError'))),{once:true});
      }));
      v.setAttribute('src',source.src);
      $(view+'-slot').replaceChildren(v);resize.observe(v);return v;
    });
    setBack(false);show();
    try{
      await Promise.all(loading);if(version!==loadVersion)return;
      viewers.forEach(v=>v.pause());
      controllers=viewers.map((v,i)=>PulseMuscles.create(v,{catalog,exerciseId:id,muscles,selectedRegion:selected,playing:false,speed:1,orbit:camera(i),reducedMotion}));
      ready=true;document.querySelectorAll('button,select,input').forEach(e=>e.disabled=false);$('status').hidden=true;
      syncRegion(true);playing=!reducedMotion;show();
    }catch(error){if(version===loadVersion&&error.name!=='AbortError'){$('status').textContent=error.message;}}
  }
  $('exercise').addEventListener('change',()=>loadExercise($('exercise').value));
  $('play').addEventListener('click',()=>{playing=!playing;last=null;show();});
  $('reset').addEventListener('click',()=>jump(0));
  $('seek').addEventListener('input',()=>jump(Number($('seek').value)));
  $('previous').addEventListener('click',()=>jump((Math.ceil(time*30-1e-6)-1)/30));
  $('next').addEventListener('click',()=>jump((Math.floor(time*30+1e-6)+1)/30));
  $('back').addEventListener('click',()=>setBack(!back));
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{muscles=b.dataset.mode==='on';syncRegion();}));
  document.addEventListener('visibilitychange',()=>last=null);
  function tick(now){if(ready&&playing&&!document.hidden&&last!==null){time=(time+Math.min((now-last)/1000,.1)*Number($('speed').value))%6;show();}last=now;requestAnimationFrame(tick);}
  fetch('assets/assets/muscles/catalog.json').then(r=>{if(!r.ok)throw new Error('动作说明载入失败。');return r.json();}).then(async data=>{
    catalog=data;$('catalog-count').textContent=Object.keys(data.exercises).length+' 个动作 · 肌群动态示意';
    Object.entries(data.exercises).forEach(([id,e])=>{const option=document.createElement('option');option.value=id;option.textContent=e.name;$('exercise').append(option);});
    const requested=new URLSearchParams(location.search).get('exercise');exerciseId=data.exercises[requested]?requested:'squat';$('exercise').value=exerciseId;
    await customElements.whenDefined('model-viewer');await loadExercise(exerciseId);requestAnimationFrame(tick);
  }).catch(error=>$('status').textContent=error.message);
</script>
</body>
</html>

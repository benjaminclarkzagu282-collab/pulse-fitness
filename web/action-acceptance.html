<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PULSE · 动作复核</title>
<style>body{background:#101610;color:#eff3e9;font:15px/1.7 system-ui;margin:0}main{max-width:850px;margin:auto;padding:28px 20px}a{color:#c3f16a}h1{font-size:28px}section{border:1px solid #344033;border-radius:16px;padding:20px;margin:16px 0;background:#1a2219}select,input,textarea,button{font:inherit;color:inherit;background:#253023;border:1px solid #4a5b41;border-radius:8px;padding:10px;box-sizing:border-box}input,textarea{width:100%;margin:5px 0 12px}select{width:100%}label{display:block}button{cursor:pointer;background:#c3f16a;color:#172014;font-weight:700}small{color:#a6b49b;word-break:break-all}.phases{display:flex;gap:8px;flex-wrap:wrap}.phases span{background:#293927;border-radius:20px;padding:3px 10px;font-size:12px}output{display:block;margin:12px 0}nav{display:flex;gap:20px}</style>
<main><nav><a href="/">返回 App</a><a href="exercise-review.html">3D 动作预览</a></nav>
<h1>24 动作复核工作台</h1><p>每个动作的技术验收与专业动作审核分开记录。当前全部待教练复核；填写此表不会自动获得专业认证。</p>
<section><label for="action">动作</label><select id="action"></select><h2 id="name"></h2><p><a id="preview">打开正面、侧面与关键姿势</a></p><div class="phases" id="phases"></div><p id="sources"></p><small id="hash"></small></section>
<section><h2>实际审核记录</h2><label>审核人姓名<input id="reviewer"></label><label>资质与核实信息<input id="qualification"></label><label>审核日期<input id="date" type="date"></label><label>动作版本、关键阶段、观察及问题<textarea id="notes" rows="5"></textarea></label><label>证据引用（视频时间、截图编号或文件名）<textarea id="evidence" rows="2"></textarea></label><label>结论<select id="verdict"><option value="needs_changes">需要修改</option><option value="pass">审核人记录通过，待发布负责人核实</option></select></label><p><button id="save">导出审核记录</button></p><output id="status" role="status"></output></section></main>
<script>
let actions=[];const $=id=>document.getElementById(id);
function show(){const a=actions.find(a=>a.id===$('action').value);$('name').textContent=a.name+' · 待专业复核';$('preview').href='exercise-review.html?exercise='+encodeURIComponent(a.id);$('hash').textContent='原模型 SHA-256：'+a.modelSha256;$('phases').replaceChildren(...a.phases.map(p=>{const e=document.createElement('span');e.textContent=p.label;return e;}));$('sources').replaceChildren(...a.referenceUrls.map((url,i)=>{const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener';link.textContent='参考 '+(i+1)+'　';return link;}));$('status').textContent='';}
fetch('assets/assets/muscles/review_status.json').then(r=>{if(!r.ok)throw Error('复核目录载入失败');return r.json();}).then(j=>{actions=j.actions;for(const a of actions){const o=document.createElement('option');o.value=a.id;o.textContent=a.name;$('action').append(o);}show();}).catch(e=>$('status').textContent=e.message);
$('action').addEventListener('change',show);
$('save').addEventListener('click',()=>{const a=actions.find(a=>a.id===$('action').value);if(!a)return;for(const key of ['reviewer','qualification','date','notes','evidence'])if(!$(key).value.trim()){$('status').textContent='请填写真实审核人、资质、日期、观察及证据。';return;}const record={version:1,actionId:a.id,modelSha256:a.modelSha256,reviewer:$('reviewer').value,qualification:$('qualification').value,date:$('date').value,notes:$('notes').value,evidence:$('evidence').value,verdict:$('verdict').value,publisherVerificationCompleted:false};const url=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='pulse-review-'+a.id+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='记录已导出，专业审核状态仍待发布负责人核实。';});
</script></html>
